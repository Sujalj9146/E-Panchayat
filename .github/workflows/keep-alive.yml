# Keeps the free Render API awake.
#
# Render's free web services sleep after 15 minutes without traffic, and the
# next request then waits ~50 seconds while the container boots, which made
# the first sign-in of a session very slow. Pinging /health every 10 minutes
# keeps it warm. /health also touches the database, so the Supabase project
# never goes idle long enough to be paused either.
#
# GitHub may delay scheduled runs by a few minutes under load; that is fine.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 120 https://epanchayat-api-ufr6.onrender.com/health
